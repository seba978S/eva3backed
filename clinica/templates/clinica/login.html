<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — PetCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #145a38 0%, #1a7a4c 50%, #20c997 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
        }
        .login-card .brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-card .brand i {
            font-size: 3rem;
            color: #1a7a4c;
        }
        .login-card .brand h2 {
            font-weight: 700;
            color: #1a7a4c;
            margin-top: .5rem;
        }
        .login-card .brand p {
            color: #888;
            font-size: .9rem;
        }
        .form-control:focus {
            border-color: #1a7a4c;
            box-shadow: 0 0 0 .2rem rgba(26,122,76,.2);
        }
        .btn-login {
            background: #1a7a4c;
            border: none;
            color: #fff;
            padding: .7rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
        }
        .btn-login:hover { background: #145a38; color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <i class="bi bi-heart-pulse-fill"></i>
            <h2>PetCare</h2>
            <p>Sistema de Gestión Veterinaria</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">
                    <i class="bi bi-person"></i> Usuario
                </label>
                <input type="text" class="form-control form-control-lg" id="username"
                       name="username" required autofocus placeholder="Ingrese su usuario">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                    <i class="bi bi-lock"></i> Contraseña
                </label>
                <input type="password" class="form-control form-control-lg" id="password"
                       name="password" required placeholder="Ingrese su contraseña">
            </div>
            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </button>
        </form>

        <p class="text-center text-muted mt-3 mb-0" style="font-size:.8rem;">
            PetCare &copy; 2026
        </p>
    </div>
</body>
</html>
